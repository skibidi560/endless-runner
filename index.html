
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Runner - Adventure</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  background: #172b36; color: white;
  font-family: system-ui, sans-serif;
}
main { width: min(900px, 100%); margin: auto; text-align: center; }
h1 { color: #ffe69a; letter-spacing: 2px; }
canvas {
  display: block; width: 100%; height: auto;
  border: 3px solid #d7eee5; border-radius: 12px;
  touch-action: manipulation;
}
.stats {
  display: flex; justify-content: space-around;
  flex-wrap: wrap; gap: 10px; margin: 12px 0;
}
button {
  border: 0; border-radius: 9px; padding: 11px 18px;
  margin: 4px; font-weight: bold; font-size: 15px;
  cursor: pointer; background: #f8c45c; color: #263640;
}
.hint { color: #c4d8dc; font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>🌲 LITTLE RUNNER</h1>
<p class="hint">Chạy, nhảy, thu thập xu và sống sót!</p>

<canvas id="game" width="850" height="400"></canvas>

<div class="stats">
  <span>🏆 Điểm: <b id="score">0</b></span>
  <span>🪙 Xu: <b id="coins">0</b></span>
  <span>⚡ Tốc độ: <b id="speed">1.0</b></span>
  <span>👑 Kỷ lục: <b id="best">0</b></span>
</div>

<button id="play">▶ Bắt đầu / Chơi lại</button>
<button id="sound">🔊 Bật âm thanh</button>
<p class="hint">
  Space / ↑ / W / chạm màn hình để nhảy.
  Né đá, thùng gỗ, gai và chim bay!
</p>
</main>

<script>
const canvas = document.querySelector("#game");
const ctx = canvas.getContext("2d");
const W = 850, H = 400, ground = 330;

const $ = id => document.getElementById(id);
let player, obstacles, coins, particles;
let score, collected, speed, frame, distance;
let started = false, gameOver = false;
let best = 0, soundOn = false, audio = null;
let musicTimer = null, musicStep = 0;

function reset() {
  player = {
    x: 100, y: ground - 48, w: 32, h: 48,
    vy: 0, onGround: true
  };
  obstacles = [];
  coins = [];
  particles = [];
  score = 0;
  collected = 0;
  speed = 5;
  frame = 0;
  distance = 0;
  started = false;
  gameOver = false;
  updateUI();
}
reset();

function updateUI() {
  $("score").textContent = score;
  $("coins").textContent = collected;
  $("speed").textContent = (speed / 5).toFixed(1);
  $("best").textContent = best;
}

// Procedural sound effects: no external audio files needed.
function initAudio() {
  if (!audio) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
  }
  if (audio.state === "suspended") audio.resume();
}

function tone(freq, duration = 0.1, type = "square", volume = 0.04) {
  if (!soundOn || !audio) return;

  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audio.currentTime);
  gain.gain.setValueAtTime(volume, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001, audio.currentTime + duration
  );
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + duration);
}

const melody = [
  523, 659, 784, 659, 587, 659, 440, 523,
  587, 784, 880, 784, 659, 587, 523, 440
];

function startMusic() {
  if (!soundOn || musicTimer) return;
  musicTimer = setInterval(() => {
    if (!started || gameOver || !soundOn) return;
    const note = melody[musicStep % melody.length];
    tone(note, 0.15, "square", 0.018);
    if (musicStep % 4 === 0) {
      tone(note / 2, 0.2, "triangle", 0.025);
    }
    musicStep++;
  }, 190);
}

function stopMusic() {
  if (musicTimer) clearInterval(musicTimer);
  musicTimer = null;
}

$("sound").addEventListener("click", () => {
  soundOn = !soundOn;
  $("sound").textContent = soundOn
    ? "🔊 Tắt âm thanh" : "🔇 Bật âm thanh";

  if (soundOn) {
    initAudio();
    startMusic();
    tone(660, 0.1);
  } else {
    stopMusic();
  }
});

function begin() {
  initAudio();
  if (gameOver) reset();
  started = true;
  if (soundOn) startMusic();
}

function jump() {
  if (!started || gameOver) {
    begin();
    if (player.onGround) {
      player.vy = -13.5;
      player.onGround = false;
      tone(440, 0.12, "square", 0.035);
    }
    return;
  }

  if (player.onGround) {
    player.vy = -13.5;
    player.onGround = false;
    tone(440, 0.12, "square", 0.035);
  }
}

$("play").addEventListener("click", () => {
  reset();
  begin();
});

canvas.addEventListener("pointerdown", jump);

document.addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "KeyW"].includes(e.code)) {
    e.preventDefault();
    if (!e.repeat) jump();
  }
  if (e.code === "Enter" && gameOver) {
    reset();
    begin();
  }
});

// Background with parallax hills.
function background() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#79cde4");
  sky.addColorStop(1, "#e2f3cb");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#ffeb9b";
  ctx.beginPath();
  ctx.arc(710, 65, 29, 0, Math.PI * 2);
  ctx.fill();

  for (let layer = 0; layer < 2; layer++) {
    ctx.fillStyle = layer ? "#70b18c" : "#a4d2ae";
    ctx.beginPath();
    ctx.moveTo(0, ground);
    for (let x = 0; x <= W; x += 5) {
      const y = 245 + layer * 34
        + Math.sin((x + distance * (layer + 1) * 0.22) / 75) * 22;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, ground);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = "#478d59";
  ctx.fillRect(0, ground, W, H - ground);
  ctx.fillStyle = "#36754c";
  ctx.fillRect(0, ground, W, 8);

  for (let x = -30; x < W + 40; x += 38) {
    const px = ((x - distance * 1.4) % (W + 38) + W + 38) % (W + 38);
    ctx.fillStyle = "#79b875";
    ctx.fillRect(px, ground + 20, 15, 3);
    ctx.fillRect(px + 8, ground + 44, 9, 3);
  }
}

// A small cartoon runner.
function drawPlayer() {
  const p = player;
  const bob = p.onGround && started && !gameOver
    ? Math.sin(frame * 0.35) * 2 : 0;
  const y = p.y + bob;
  const leg = p.onGround && started && !gameOver
    ? Math.sin(frame * 0.45) * 8 : 0;

  ctx.fillStyle = "rgba(25,55,42,0.2)";
  ctx.beginPath();
  ctx.ellipse(p.x + 18, ground + 2, 23, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#304e68";
  ctx.fillRect(p.x + 7, y + 32, 8, 12 + leg);
  ctx.fillRect(p.x + 20, y + 32, 8, 12 - leg);

  ctx.fillStyle = "#f7f0d5";
  ctx.fillRect(p.x + 3, y + 42 + leg, 14, 6);
  ctx.fillRect(p.x + 18, y + 42 - leg, 14, 6);

  ctx.fillStyle = "#f28f62";
  ctx.fillRect(p.x + 5, y + 15, 25, 21);
  ctx.fillRect(p.x + 3, y + 20, 5, 13);

  ctx.fillStyle = "#ffd2a1";
  ctx.fillRect(p.x + 8, y, 21, 21);
  ctx.fillStyle = "#263640";
  ctx.fillRect(p.x + 21, y + 7, 4, 4);

  ctx.fillStyle = "#304e68";
  ctx.fillRect(p.x + 5, y - 3, 23, 7);
  ctx.fillRect(p.x + 11, y - 8, 13, 7);
}

// Five kinds of obstacles.
function spawnObstacle() {
  const types = ["rock", "crate", "spikes", "cactus", "bird"];
  const type = types[Math.floor(Math.random() * types.length)];

  let o = { type, x: W + 20, w: 30, h: 35, y: 0 };

  if (type === "rock") {
    o.w = 31; o.h = 30 + Math.random() * 12;
    o.y = ground - o.h;
  } else if (type === "crate") {
    o.w = 34; o.h = 38; o.y = ground - o.h;
  } else if (type === "spikes") {
    o.w = 43; o.h = 27; o.y = ground - o.h;
  } else if (type === "cactus") {
    o.w = 27; o.h = 47; o.y = ground - o.h;
  } else {
    o.w = 38; o.h = 23;
    o.y = ground - 72 - Math.random() * 35;
  }
  obstacles.push(o);
}

function drawObstacle(o) {
  const x = o.x, y = o.y;

  if (o.type === "rock") {
    ctx.fillStyle = "#727d81";
    ctx.beginPath();
    ctx.moveTo(x, ground);
    ctx.lineTo(x + 4, y + 12);
    ctx.lineTo(x + o.w * 0.5, y);
    ctx.lineTo(x + o.w, y + 8);
    ctx.lineTo(x + o.w, ground);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#b5c1bb";
    ctx.fillRect(x + 8, y + 14, 8, 3);
  }

  if (o.type === "crate") {
    ctx.fillStyle = "#8b5735";
    ctx.fillRect(x, y, o.w, o.h);
    ctx.strokeStyle = "#edb66d";
    ctx.lineWidth = 4;
    ctx.strokeRect(x + 3, y + 3, o.w - 6, o.h - 6);
    ctx.beginPath();
    ctx.moveTo(x + 5, y + 5);
    ctx.lineTo(x + o.w - 5, y + o.h - 5);
    ctx.moveTo(x + o.w - 5, y + 5);
    ctx.lineTo(x + 5, y + o.h - 5);
    ctx.stroke();
  }

  if (o.type === "spikes") {
    ctx.fillStyle = "#dbe4e5";
    ctx.beginPath();
    ctx.moveTo(x, ground);
    for (let i = 0; i < 4; i++) {
      ctx.lineTo(x + i * 12 + 6, y);
      ctx.lineTo(x + (i + 1) * 12, ground);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#73828b";
    ctx.fillRect(x, ground - 3, o.w, 4);
  }

  if (o.type === "cactus") {
    ctx.fillStyle = "#27835b";
    ctx.fillRect(x + 8, y, 12, o.h);
    ctx.fillRect(x, y + 15, 10, 8);
    ctx.fillRect(x, y + 10, 6, 13);
    ctx.fillRect(x + 19, y + 22, 9, 8);
    ctx.fillRect(x + 22, y + 15, 6, 15);
    ctx.fillStyle = "#8bd39b";
    ctx.fillRect(x + 11, y + 5, 3, 13);
  }

  if (o.type === "bird") {
    const flap = Math.sin(frame * 0.3) * 7;
    ctx.fillStyle = "#39485b";
    ctx.fillRect(x + 10, y + 8, 20, 10);
    ctx.fillRect(x + 27, y + 8, 9, 5);
    ctx.fillStyle = "#f4c76a";
    ctx.fillRect(x + 34, y + 10, 7, 3);
    ctx.fillStyle = "#39485b";
    ctx.save();
    ctx.translate(x + 18, y + 10);
    ctx.rotate(flap * Math.PI / 180);
    ctx.fillRect(-3, -12, 7, 14);
    ctx.restore();
    ctx.fillRect(x + 12, y + 18, 4, 5);
  }
}

function spawnCoins() {
  const count = 4 + Math.floor(Math.random() * 3);
  const high = Math.random() < 0.5;
  for (let i = 0; i < count; i++) {
    coins.push({
      x: W + 30 + i * 32,
      y: high ? ground - 100 : ground - 58,
      r: 9, taken: false
    });
  }
}

function drawCoins() {
  for (const c of coins) {
    if (c.taken) continue;

    ctx.fillStyle = "#d99225";
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r, c.r, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffe88a";
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r * 0.65, c.r * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#d99225";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("$", c.x, c.y + 5);
  }
  ctx.textAlign = "left";
}

function burst(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 1) * 4,
      life: 25, color
    });
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 25);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 5, 5);
    ctx.globalAlpha = 1;
  }
}

function update() {
  if (!started || gameOver) return;

  frame++;
  distance += speed;
  score = Math.floor(distance / 10) + collected * 5;
  speed = Math.min(5 + score / 180, 12);

  player.vy += 0.65;
  player.y += player.vy;

  if (player.y + player.h >= ground) {
    player.y = ground - player.h;
    player.vy = 0;
    player.onGround = true;
  }

  const spawnRate = Math.max(42, Math.floor(85 - speed * 3));
  if (frame % spawnRate === 0) spawnObstacle();
  if (frame % 115 === 0) spawnCoins();

  for (const o of obstacles) {
    o.x -= speed;

    const px1 = player.x + 5;
    const px2 = player.x + player.w - 4;
    const py1 = player.y + 5;
    const py2 = player.y + player.h - 3;

    const ox1 = o.x + 3;
    const ox2 = o.x + o.w - 3;
    const oy1 = o.y + (o.type === "bird" ? 3 : 5);
    const oy2 = o.y + o.h - 2;

    if (px2 > ox1 && px1 < ox2 && py2 > oy1 && py1 < oy2) {
      gameOver = true;
      best = Math.max(best, score);
      tone(110, 0.35, "sawtooth", 0.07);
      burst(player.x + 16, player.y + 20, "#ffd166");
      stopMusic();
      break;
    }
  }

  for (const c of coins) {
    c.x -= speed;
    const dx = player.x + player.w / 2 - c.x;
    const dy = player.y + player.h / 2 - c.y;

    if (!c.taken && Math.hypot(dx, dy) < 25) {
      c.taken = true;
      collected++;
      tone(880, 0.09, "sine", 0.05);
      burst(c.x, c.y, "#ffdf62");
    }
  }

  obstacles = obstacles.filter(o => o.x + o.w > 0);
  coins = coins.filter(c => c.x > -20 && !c.taken);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);

  updateUI();
}

function overlay(title, subtitle, subtitle2 = "") {
  ctx.fillStyle = "rgba(18,39,48,0.68)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffe69a";
  ctx.font = "bold 38px system-ui";
  ctx.fillText(title, W / 2, 155);

  ctx.fillStyle = "white";
  ctx.font = "18px system-ui";
  ctx.fillText(subtitle, W / 2, 198);

  if (subtitle2) {
    ctx.font = "15px system-ui";
    ctx.fillText(subtitle2, W / 2, 230);
  }
  ctx.textAlign = "left";
}

function draw() {
  background();
  drawCoins();
  obstacles.forEach(drawObstacle);
  drawPlayer();
  drawParticles();

  if (!started && !gameOver) {
    overlay("LITTLE RUNNER", "Nhấn Bắt đầu hoặc chạm màn hình", "Thu thập xu và tránh mọi vật cản!");
  }

  if (gameOver) {
    overlay("GAME OVER", `Điểm: ${score}  •  Xu: ${collected}`, "Nhấn Chơi lại để bắt đầu cuộc phiêu lưu mới!");
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
